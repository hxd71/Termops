[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termops"
version = "0.8.0"
description = "Terminal operations agent — LLM-powered error analysis with approval-gated remediation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "click>=8.1.8",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.5",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "psutil>=6.1.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0.0",
]

[project.scripts]
termops = "termops.cli:main"
termops-agent = "termops.daemon:main"
erra = "termops.cli:main"
erra-agent = "termops.daemon:main"

[project.urls]
Homepage = "https://github.com/hxd71/Termops"
Repository = "https://github.com/hxd71/Termops"
Issues = "https://github.com/hxd71/Termops/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/termops"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true